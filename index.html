    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "UNINwalk",
        "description": "Interactive campus navigation tool for University North (UNIN). Find rooms, professor offices, and navigate the campus buildings with ease.",

        "applicationCategory": "NavigationApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        },
        "featureList": [
          "Interactive campus map",
          "Room finder",
          "Professor directory",
          "AI chatbot assistant",
          "Multi-building navigation (UNIN-1, UNIN-2, UNIN-3)"
        ],
        "provider": {
          "@type": "EducationalOrganization",
          "name": "University North",
          "url": "https://unin.hr"
        }
      }

    <div id="app"></div>

    <!-- Noscript Fallback for SEO and Accessibility -->

      <div
        style="
          max-width: 800px;
          margin: 50px auto;
          padding: 20px;
          font-family: Arial, sans-serif;
        "
      >
        <h1>UNINwalk - University North Campus Navigation</h1>
        <p>
          Welcome to UNINwalk, the interactive campus navigation tool for
          University North (Sveučilište Sjever).
        </p>

        <h2>Features</h2>
        <ul>
          <li>
            <strong>Interactive Campus Map</strong> - Navigate UNIN-1, UNIN-2,
            and UNIN-3 buildings
          </li>
          <li>
            <strong>Room Finder</strong> - Quickly locate any classroom or
            facility
          </li>
          <li>
            <strong>Professor Directory</strong> - Find professor offices and
            contact information
          </li>
          <li>
            <strong>AI Chatbot Assistant</strong> - Ask questions about rooms
            and professors
          </li>
          <li>
            <strong>Floor Plans</strong> - Detailed layouts of all building
            floors
          </li>
        </ul>

        <h2>Buildings</h2>
        <ul>
          <li><strong>UNIN-1:</strong> Rooms 1-39 (2 floors)</li>
          <li><strong>UNIN-2:</strong> Main academic building</li>
          <li><strong>UNIN-3:</strong> Additional facilities</li>
        </ul>

        <h2>How to Use</h2>
        <p>
          JavaScript is required to use the interactive features of UNINwalk.
          Please enable JavaScript in your browser to access:
        </p>
        <ul>
          <li>Interactive campus maps</li>
          <li>Real-time room search</li>
          <li>Professor finder</li>
          <li>AI chatbot assistance</li>
        </ul>

        <p>
          <strong>University North</strong><br />
          Sveučilište Sjever<br />
          Croatia
